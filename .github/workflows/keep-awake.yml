# Render's free plan puts the search server to sleep after 15 minutes without
# visits, and waking it takes up to a minute. This visits it every 10 minutes,
# day and night, so searches are usually instant. (GitHub runs scheduled jobs
# a few minutes late at busy times, hence 10 rather than 15.)
# Cost: Actions minutes are free for public repos. On Render, one service
# awake all month uses about 744 of the free plan's 750 instance hours.

name: Keep search server awake

on:
  schedule:
    - cron: "*/10 * * * *"
  workflow_dispatch:

jobs:
  ping:
    runs-on: ubuntu-latest
    timeout-minutes: 3
    steps:
      - name: Visit the search server
        run: curl -fsS --max-time 120 -o /dev/null -w "%{http_code} in %{time_total}s\n" https://webshelf-search-us.onrender.com/healthz
