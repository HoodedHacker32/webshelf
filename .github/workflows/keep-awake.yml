# Render's free plan puts the search server to sleep after 15 minutes without
# visits, and waking it takes up to a minute. UptimeRobot (free plan) visits
# https://webshelf-search-us.onrender.com/healthz every 5 minutes to keep it
# awake; GitHub's own schedule ran only every few hours, so it isn't used.
# This workflow stays as a manual "wake it now" button (Actions > Keep search
# server awake > Run workflow).

name: Keep search server awake

on:
  workflow_dispatch:

jobs:
  ping:
    runs-on: ubuntu-latest
    timeout-minutes: 5
    steps:
      # A sleeping server answers 502 for the first few seconds while it
      # starts, so keep asking (every 10 s, for up to 3 minutes) until it's up.
      - name: Visit the search server
        run: |
          curl -fsS --retry 18 --retry-all-errors --retry-delay 10 --retry-max-time 180 \
            --max-time 60 -o /dev/null -w "%{http_code} in %{time_total}s\n" \
            https://webshelf-search-us.onrender.com/healthz
