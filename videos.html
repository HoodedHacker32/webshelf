<!doctype html>
<html lang="en">
<head>
  <meta charset="utf-8">
  <meta name="viewport" content="width=device-width, initial-scale=1">
  <title>Webshelf</title>
  <meta name="referrer" content="no-referrer">
  <meta name="color-scheme" content="light dark">
  <script>
    (function () {
      var t = 'auto';
      try { t = JSON.parse(localStorage.getItem('webshelf:settings') || '{}').theme || 'auto'; } catch (e) {}
      var dark = t === 'dark' || (t === 'auto' && window.matchMedia('(prefers-color-scheme: dark)').matches);
      document.documentElement.dataset.theme = dark ? 'dark' : 'light';
    })();
  </script>
  <link rel="icon" href="logos/logo.svg" type="image/svg+xml">
  <link rel="preload" href="assets/fonts/redaction-latin-400-normal.woff2" as="font" type="font/woff2" crossorigin>
  <link rel="preload" href="assets/fonts/redaction-latin-700-normal.woff2" as="font" type="font/woff2" crossorigin>
  <link rel="preload" href="assets/fonts/redaction-35-latin-400-normal.woff2" as="font" type="font/woff2" crossorigin>
  <link rel="preload" href="assets/fonts/courier-prime-latin-400-normal.woff2" as="font" type="font/woff2" crossorigin>
  <link rel="stylesheet" href="assets/css/tokens.css">
  <link rel="stylesheet" href="assets/css/base.css">
  <link rel="stylesheet" href="assets/css/serp.css">
  <link rel="stylesheet" href="assets/css/verticals.css">
  <script type="module" src="assets/js/videos.js"></script>
</head>
<body class="serp is-videos">
  <a class="skip-link" href="#results">Skip to videos</a>

  <header class="toolbar" id="toolbar">
    <a class="toolbar-logo logo" href="index.html" data-logo="lockup" data-label="Webshelf home">
      <img src="logos/lockup.svg" alt="Webshelf home" width="186" height="86">
    </a>
    <div class="toolbar-search" id="serp-search"></div>
    <nav class="toolbar-links" aria-label="Site"><a href="settings.html">Settings</a></nav>
    <nav class="toolbar-tabs" id="serp-tabs" aria-label="Search type">
      <a class="tab" href="search.html" data-page="search.html">All</a>
      <a class="tab" href="images.html" data-page="images.html">Images</a>
      <a class="tab" href="videos.html" data-page="videos.html" aria-current="page">Videos</a>
    </nav>
  </header>

  <main class="serp-main" id="main">
    <div class="vertical">
      <h1 class="visually-hidden" id="serp-h1">Videos</h1>
      <p class="serp-status" id="serp-status" aria-live="polite"></p>
      <ol class="results video-list" id="results" tabindex="-1"></ol>
      <div id="serp-more"></div>
    </div>
  </main>

  <footer class="site-footer">
    <div class="site-footer-row">
      <p id="serp-source-note"></p>
      <div class="site-footer-links">
        <a href="settings.html#privacy">Privacy</a>
        <a href="settings.html">Settings</a>
      </div>
    </div>
  </footer>
</body>
</html>
