# SearXNG settings for Webshelf. Anything not set here keeps SearXNG's default.
# Single-container version: no Valkey, so no rate limiter.

use_default_settings:
  engines:
    # Engines that tolerate requests from a cloud server. Google, Bing and
    # DuckDuckGo mostly answer data-centre addresses with CAPTCHAs, so they're
    # left out; SearXNG also pauses any engine that starts failing.
    # Tested from Render (Frankfurt), 2026-10-03: Mwmbl, Wikipedia and Bing
    # answer. Google (access denied), Startpage and Qwant (CAPTCHA), Mojeek and
    # DuckDuckGo (timeouts) and Brave (rate limited) are blocked from cloud
    # addresses; Yahoo returns unrelated spam. Blocked engines only add delay.
    keep_only:
      # Web
      - mwmbl
      - bing
      - brave
      - wikipedia
      - wikidata
      # Images
      - openverse
      - wikicommons.images
      - bing images
      # Videos
      - youtube
      - dailymotion
      - sepiasearch
      - vimeo
      - bing videos
      # News
      - bing news

general:
  instance_name: "Webshelf search"
  enable_metrics: false

search:
  safe_search: 1
  autocomplete: ""
  default_lang: "en"
  formats:
    - html
    - json

server:
  secret_key: "CHANGE_ME"
  limiter: false
  public_instance: false
  image_proxy: false
  method: "GET"

outgoing:
  request_timeout: 3.0
  max_request_timeout: 6.0

engines:
  # Off by default in SearXNG; on for Webshelf.
  - name: mwmbl
    disabled: false
  - name: openverse
    disabled: false
  - name: bing
    disabled: false
