# SearXNG settings for Webshelf. Anything not set here keeps SearXNG's default.
# Single-container version: no Valkey, so no rate limiter.

use_default_settings:
  engines:
    # Engines that answer requests from a cloud server; SearXNG also pauses any
    # engine that starts failing.
    # Tested from Render, 2026-10-03: Mwmbl, Wikipedia and Bing answer (Bing in
    # English only from a US region, so the service runs in Virginia).
    # Retested 2026-10-05: Bing now searches only the first word of a query
    # sent from a server (so Webshelf's ranking trusts it less when its results
    # lack the other words); Yep and Mojeek deny access, DuckDuckGo times out,
    # Yahoo returns Bing's results, Qwant shows a CAPTCHA.
    # Google (access denied), Startpage and Qwant (CAPTCHA), Mojeek and
    # DuckDuckGo (timeouts) and Brave (rate limited) are blocked from cloud
    # addresses; Yahoo returns unrelated spam. Blocked engines only add delay.
    keep_only:
      # Web
      - mwmbl
      - bing
      - brave
      - wikipedia
      - wikidata
      # Images
      - openverse
      - wikicommons.images
      - bing images
      # Images on trial (disabled below; used only when named with engines=…)
      - flickr
      - deviantart
      - wallhaven
      - pinterest
      - imgur
      - pexels
      - unsplash
      - artstation
      - pixabay images
      - brave.images
      - duckduckgo images
      # Videos
      - youtube
      - dailymotion
      - sepiasearch
      - vimeo
      - bing videos
      # News
      - bing news

general:
  instance_name: "Webshelf search"
  enable_metrics: false

search:
  safe_search: 1
  # Query suggestions while typing (the search box asks /autocompleter).
  autocomplete: "bing"
  default_lang: "en"
  formats:
    - html
    - json

server:
  secret_key: "CHANGE_ME"
  limiter: false
  public_instance: false
  image_proxy: false
  method: "GET"

outgoing:
  request_timeout: 3.0
  max_request_timeout: 6.0

engines:
  # Off by default in SearXNG; on for Webshelf.
  # SearXNG ranks merged results partly by engine weight. Bing's index is far
  # bigger, so its results lead; Mwmbl fills in after them.
  - name: mwmbl
    disabled: false
    weight: 0.4
  - name: openverse
    disabled: false
  - name: bing
    disabled: false
    weight: 2
  # Image engines on trial, see keep_only.
  - name: flickr
    disabled: true
    inactive: false
  - name: deviantart
    disabled: true
    inactive: false
  - name: wallhaven
    disabled: true
    inactive: false
  - name: pinterest
    disabled: true
    inactive: false
  - name: imgur
    disabled: true
    inactive: false
  - name: pexels
    disabled: true
    inactive: false
  - name: unsplash
    disabled: true
    inactive: false
  - name: artstation
    disabled: true
    inactive: false
  - name: pixabay images
    disabled: true
    inactive: false
  - name: brave.images
    disabled: true
    inactive: false
  - name: duckduckgo images
    disabled: true
    inactive: false
