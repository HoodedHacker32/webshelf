# SearXNG settings for Webshelf. Anything not set here keeps SearXNG's default.
# Single-container version: no Valkey, so no rate limiter.

use_default_settings:
  engines:
    # Engines that answer requests from a cloud server; SearXNG also pauses any
    # engine that starts failing.
    # Tested from Render, 2026-10-03: Mwmbl, Wikipedia and Bing answer (Bing in
    # English only from a US region, so the service runs in Virginia).
    # Retested 2026-10-05: Bing now searches only the first word of a query
    # sent from a server (so Webshelf's ranking trusts it less when its results
    # lack the other words); Yep and Mojeek deny access, DuckDuckGo times out,
    # Yahoo returns Bing's results, Qwant shows a CAPTCHA.
    # Google (access denied), Startpage and Qwant (CAPTCHA), Mojeek and
    # DuckDuckGo (timeouts) and Brave (rate limited) are blocked from cloud
    # addresses; Yahoo returns unrelated spam. Blocked engines only add delay.
    keep_only:
      # Web
      - mwmbl
      - bing
      - brave
      - wikipedia
      - wikidata
      # Images
      - openverse
      - wikicommons.images
      - bing images
      - flickr
      - deviantart
      - artstation
      - pinterest
      - imgur
      - pixabay images
      - pexels
      # Videos
      - youtube
      - dailymotion
      - sepiasearch
      - vimeo
      - bing videos
      # News
      - bing news

general:
  instance_name: "Webshelf search"
  enable_metrics: false

search:
  safe_search: 1
  # Query suggestions while typing (the search box asks /autocompleter).
  autocomplete: "bing"
  default_lang: "en"
  formats:
    - html
    - json

server:
  secret_key: "CHANGE_ME"
  limiter: false
  public_instance: false
  image_proxy: false
  method: "GET"

outgoing:
  request_timeout: 3.0
  max_request_timeout: 6.0

engines:
  # Off by default in SearXNG; on for Webshelf.
  # SearXNG ranks merged results partly by engine weight. Bing's index is far
  # bigger, so its results lead; Mwmbl fills in after them.
  - name: mwmbl
    disabled: false
    weight: 0.4
  - name: openverse
    disabled: false
  # Images. Tested from Render, 2026-10-05: Flickr, DeviantArt and ArtStation
  # match searches well; Pinterest, Imgur, Pixabay and Pexels more loosely.
  # Bing Images often answers a server with unrelated pictures, so it counts
  # least, and the Images tab drops any image whose title doesn't match.
  # Wallhaven (no titles), Unsplash (parsing errors) and DuckDuckGo (access
  # denied) didn't work.
  - name: bing images
    weight: 0.3
  - name: flickr
    disabled: false
  - name: deviantart
    disabled: false
    inactive: false
  - name: artstation
    disabled: false
  - name: pinterest
    disabled: false
  - name: imgur
    disabled: false
  - name: pixabay images
    disabled: false
  - name: pexels
    disabled: false
    weight: 0.6
  - name: bing
    disabled: false
    weight: 2
