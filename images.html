<!doctype html>
<html lang="en">
<head>
  <meta charset="utf-8">
  <meta name="viewport" content="width=device-width, initial-scale=1">
  <title>Webshelf</title>
  <meta name="referrer" content="no-referrer">
  <meta name="color-scheme" content="light dark">
  <meta name="description" content="Webshelf image search.">
  <meta name="robots" content="noindex">
  <meta property="og:type" content="website">
  <meta property="og:site_name" content="Webshelf">
  <meta property="og:title" content="Webshelf Images">
  <meta property="og:description" content="Webshelf is a free, open-source search engine with no AI: web results, images, videos and instant answers, ranked by rules anyone can read.">
  <meta property="og:image" content="https://hoodedhacker32.github.io/webshelf/assets/icons/og-image.png">
  <meta property="og:image:width" content="1200">
  <meta property="og:image:height" content="630">
  <meta name="twitter:card" content="summary_large_image">
  <meta name="theme-color" content="#e7e7e7">
  <link rel="manifest" href="manifest.webmanifest">
  <link rel="apple-touch-icon" href="assets/icons/apple-touch-icon.png">
  <link rel="search" type="application/opensearchdescription+xml" title="Webshelf" href="opensearch.xml">
  <script>
    (function () {
      var t = 'auto';
      try { t = JSON.parse(localStorage.getItem('webshelf:settings') || '{}').theme || 'auto'; } catch (e) {}
      var dark = t === 'dark' || (t === 'auto' && window.matchMedia('(prefers-color-scheme: dark)').matches);
      document.documentElement.dataset.theme = dark ? 'dark' : 'light';
    })();
  </script>
  <link rel="icon" href="logos/pixel-icon.svg" type="image/svg+xml">
  <link rel="preload" href="assets/fonts/redaction-latin-400-normal.woff2" as="font" type="font/woff2" crossorigin>
  <link rel="preload" href="assets/fonts/redaction-latin-700-normal.woff2" as="font" type="font/woff2" crossorigin>
  <link rel="preload" href="assets/fonts/redaction-35-latin-400-normal.woff2" as="font" type="font/woff2" crossorigin>
  <link rel="preload" href="assets/fonts/courier-prime-latin-400-normal.woff2" as="font" type="font/woff2" crossorigin>
  <link rel="stylesheet" href="assets/css/tokens.css">
  <link rel="stylesheet" href="assets/css/base.css">
  <link rel="stylesheet" href="assets/css/serp.css">
  <link rel="stylesheet" href="assets/css/verticals.css">
  <script type="module" src="assets/js/images.js"></script>
</head>
<body class="serp is-images">
  <a class="skip-link" href="#results">Skip to images</a>

  <header class="toolbar" id="toolbar">
    <a class="toolbar-logo logo" href="index.html" data-logo="pixel-lockup" data-label="Webshelf home">
      <img src="logos/pixel-lockup.svg" alt="Webshelf home" width="186" height="53">
    </a>
    <div class="toolbar-search" id="serp-search"></div>
    <nav class="toolbar-links" aria-label="Site"><a href="settings.html">Settings</a></nav>
    <nav class="toolbar-tabs" id="serp-tabs" aria-label="Search type">
      <a class="tab" href="search.html" data-page="search.html">All</a>
      <a class="tab" href="images.html" data-page="images.html" aria-current="page">Images</a>
      <a class="tab" href="videos.html" data-page="videos.html">Videos</a>
      <a class="tab" href="books.html" data-page="books.html">Books</a>
      <a class="tab" href="maps.html" data-page="maps.html">Maps</a>
    </nav>
  </header>

  <main class="serp-main" id="main">
    <div class="vertical">
      <h1 class="visually-hidden" id="serp-h1">Images</h1>
      <p class="serp-status" id="serp-status" aria-live="polite"></p>
      <ul class="image-grid" id="results" tabindex="-1"></ul>
      <div id="serp-more"></div>
    </div>
    <dialog class="viewer" id="viewer" aria-labelledby="viewer-title"></dialog>
  </main>

  <footer class="site-footer">
    <div class="site-footer-row">
      <p id="serp-source-note"></p>
      <div class="site-footer-links">
        <a href="about.html">About</a>
        <a href="privacy.html">Privacy</a>
        <a href="settings.html">Settings</a>
      </div>
    </div>
  </footer>
</body>
</html>
